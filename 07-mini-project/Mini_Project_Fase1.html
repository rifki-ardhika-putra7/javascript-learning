<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Project Fase 1 — Kartu Profil & Skill</title>
    <!--
        ===================================================================
        MINI PROJECT FASE 1 — KARTU PROFIL & DAFTAR SKILL
        Gabungan semua materi HTML + CSS + JS yang sudah dipelajari.
        Kerjakan berurutan: A (HTML) -> B (CSS) -> C (JavaScript).
        Tulis kodemu sendiri. Mentok? minta bantuan debug, jangan jawaban jadi.
        ===================================================================
    -->
    <style>
        /* ===== STARTER (sudah disiapkan, boleh diubah) ===== */
        :root {
            --warna-utama: #940909;
            --warna-bg: #f8fafc;
            --warna-card: #ffffff;
            --warna-teks: #3b1e1e;
            --warna-teks-muda: #8b6464;
            --radius: 12px;
            --shadow: 0 10px 25px rgba(42, 15, 15, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, sans-serif;
            background: var(--warna-bg);
            color: var(--warna-teks);
            line-height: 1.6;
            padding: 0 1rem 2rem;
        }

        /* ===================== BAGIAN B — CSS (kerjakan di sini) =====================
           B1. Pakai/ tambah CSS variables di :root (warna, radius) — starter sudah ada.
           B2. Buat <nav> jadi baris horizontal pakai Flexbox.
           B3. Tampilkan kartu skill / galeri pakai CSS Grid.
           B4. Tambahkan hover transition pada tombol atau kartu (warna / transform: scale).
           B5. Tambahkan minimal 1 animasi @keyframes (mis. fade-in / pulse pada header).
           B6. Pakai pseudo-element ::before atau ::after untuk dekorasi/badge.
           B7. Buat responsive: pakai @media agar rapi di layar kecil (mis. grid jadi 1 kolom).
        ============================================================================= */
        header {
            background: linear-gradient(135deg, var(--warna-utama), #ed3a3a);
            color: white;
            padding: 3rem 1.5rem;
            border-radius: 0 0 var(--radius) var(--radius);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease-out;
        }

        header::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.25), transparent 60%);
            pointer-events: none;
        }

        header h1,
        header p,
        nav {
            position: relative;
            z-index: 1;
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        nav {
            margin-top: 1.5rem;
        }

        nav ul {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            list-style: none;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 0.7rem 1rem;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 999px;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        nav a:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        body > section,
        footer {
            width: min(900px, 100%);
            margin: 1.5rem auto 0;
            background: var(--warna-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.5rem;
            position: relative;
        }

        body > section::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background: var(--warna-utama);
            border-radius: var(--radius) 0 0 var(--radius);
        }

        section h2 {
            color: var(--warna-utama);
            margin-bottom: 1rem;
        }

        #profil {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 1.25rem;
            align-items: center;
        }

        #profil img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 80%;
            border: 4px solid var(--warna-utama);
            justify-self: center;
        }

        #skill ul {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            list-style: none;
        }

        #skill li {
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            padding: 1rem;
            border-radius: var(--radius);
            border: 1px solid #e2e8f0;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        #skill li:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: var(--shadow);
        }

        form {
            display: grid;
            gap: 0.9rem;
        }

        label {
            font-weight: 600;
        }

        input,
        select,
        textarea,
        button {
            width: 100%;
            font: inherit;
            padding: 0.8rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: var(--radius);
        }

        input[type="checkbox"],
        input[type="radio"] {
            width: auto;
            margin-right: 0.5rem;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button {
            background: var(--warna-utama);
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        button:hover {
            background: #4338ca;
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            color: var(--warna-teks-muda);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 700px) {
            header {
                padding: 2rem 1rem;
            }

            nav ul {
                flex-direction: column;
                align-items: center;
            }

            #profil {
                grid-template-columns: 1fr;
                text-align: center;
            }

            #skill ul {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- ===================== BAGIAN A — HTML (kerjakan di sini) =====================
         A1. Pakai tag semantik: <header>, <nav>, <main>, <section>, <footer>.
         A2. <header>: nama kamu (judul) + tagline. <nav>: minimal 3 link (Profil, Skill, Kontak).
         A3. Section PROFIL: sebuah <img> (boleh placeholder) + paragraf deskripsi singkat.
         A4. Section SKILL: sebuah <table> (table/tr/th/td) min. 3 skill + level, ATAU daftar <ul><li>.
         A5. Section KONTAK: sebuah <form> berisi input teks (nama), email, <select>, <textarea>,
             sepasang radio/checkbox, dan tombol submit. Pakai <label> untuk tiap input.
         A6. <footer>: teks copyright.
    ============================================================================== -->
    <header>
        <h1>Nama Kamu</h1>
        <p>Tagline singkat tentang dirimu.</p>
        <nav>
            <ul>
                <li><a href="#profil">Profil</a></li>
                <li><a href="#skill">Skill</a></li>
                <li><a href="#kontak">Kontak</a></li>
            </ul>
        </nav>
    </header>
    <section id="profil">
        <h2>Profil</h2>
        <img src="https://via.placeholder.com/150" alt="Foto Profil">
        <p>Nama gw rifki, gw sedang belajar HTML dan CSS.</p>
    </section>
    <section id="skill">
        <h2>Skill</h2>
        <ul>
            <li>HTML: 90</li>
            <li>CSS: 85</li>
            <li>JavaScript: 80</li>
            <li>Python: 80</li>
        </ul>
    </section>
    <section id="kontak">
        <h2>Kontak</h2>
        <form>
            <label for="nama">Nama:</label>
            <input type="text" id="nama" name="nama" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="subjek">Subjek:</label>
            <select id="subjek" name="subjek">
                <option value="pertanyaan">Pertanyaan</option>
                <option value="saran">Saran</option>
                <option value="lainnya">Lainnya</option>
            </select>
            <label for="pesan">Pesan:</label>
            <textarea id="pesan" name="pesan" required></textarea>
            <label>
                <input type="checkbox" name="newsletter"> Berlangganan newsletter
            </label>
            <label>
                <input type="radio" name="prioritas" value="tinggi"> Prioritas Tinggi
            </label>
            <label>
                <input type="radio" name="prioritas" value="normal" checked> Prioritas Normal
            </label>
            <button type="submit">Kirim</button>
        </form>
    </section>
    <footer>
        <p>&copy; Rifki ardhika putra. All rights reserved.</p>
    </footer>


    <!-- ===================== BAGIAN C — JAVASCRIPT (logika di Console) =====================
         Kerjakan di <script> di bawah. Hasil dilihat di Console (F12). Belum pakai DOM.
         C1. Buat array of object "daftarSkill", tiap item { nama, nilai } (0-100), min. 4 skill.
         C2. Pakai loop untuk console.log tiap skill, format: "HTML: 90".
         C3. Buat fungsi rataRata(arr) -> return rata-rata semua nilai, lalu console.log.
         C4. Buat fungsi kategori(nilai) pakai if/else if atau switch:
             nilai >= 85 -> "Mahir", >= 70 -> "Menengah", selain itu -> "Pemula".
             Loop daftar skill dan cetak: "HTML: Mahir".
         C5. Buat fungsi skillTertinggi(arr) -> return NAMA skill dengan nilai terbesar, lalu console.log.
         C6. (Bonus) Hitung berapa skill kategori "Mahir" pakai loop + counter, lalu cetak jumlahnya.
    ==================================================================================== -->
    <script>
        // Tulis kode Bagian C di sini:
        const daftarSkill = [
            { nama: "HTML", nilai: 90 },
            { nama: "CSS", nilai: 85 },
            { nama: "JavaScript", nilai: 80 },
            { nama: "Python", nilai: 80 }
        ];

        let totalNilai = 0;
        for (const skill of daftarSkill) {
            console.log(`${skill.nama}: ${skill.nilai}`);
            totalNilai += skill.nilai;
        }
        console.log(`Rata-rata nilai: ${totalNilai / daftarSkill.length}`);

        function rataRata(arr) {
            const total = arr.reduce((sum, skill) => sum + skill.nilai, 0);
            return total / arr.length;
        }
        console.log(`Rata-rata nilai (fungsi): ${rataRata(daftarSkill)}`);

        function kategori(nilai) {
            if (nilai >= 85) return "Mahir";
            else if (nilai >= 70) return "Menengah";
            else return "Pemula";
        }
        for (const skill of daftarSkill) {
            console.log(`${skill.nama}: ${kategori(skill.nilai)}`);
        }

        function skillTertinggi(arr) {
            let tertinggi = arr[0];
            for (const skill of arr) {
                if (skill.nilai > tertinggi.nilai) {
                    tertinggi = skill;
                }
            }
            return tertinggi.nama;
        }
        console.log(`Skill tertinggi: ${skillTertinggi(daftarSkill)}`);

        let countMahir = 0;
        for (const skill of daftarSkill) {
            if (kategori(skill.nilai) === "Mahir") {
                countMahir++;
            }
        }
        console.log(`Jumlah skill kategori "Mahir": ${countMahir}`);

    </script>
</body>
</html>
