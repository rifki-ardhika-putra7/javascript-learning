<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Fetch API Lanjutan</title>
    <style>
        body { font-family: Inter, system-ui, sans-serif; margin: 0; padding: 2rem; background: #f8fafc; color: #0f172a; }
        main { max-width: 800px; margin: 0 auto; background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); }
        h1 { margin-top: 0; }
        code { background: #e2e8f0; padding: 0.15rem 0.35rem; border-radius: 0.3rem; }
    </style>
</head>
<body>
    <main>
        <h1>Latihan Fetch API Lanjutan</h1>
        <p>Ambil data dari API dan lihat hasil di Console.</p>

        <script>
            fetch("https://jsonplaceholder.typicode.com/posts/1")
                .then((response) => response.json())
                .then((data) => {
                    console.log("Data dari API:", data);
                })
                .catch((error) => {
                    console.log("Gagal mengambil data:", error);
                });
        </script>
    </main>
</body>
</html>
