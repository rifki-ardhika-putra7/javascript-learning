<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan React useEffect + Fetch</title>
    <style>
        body { font-family: Inter, system-ui, sans-serif; margin: 0; padding: 2rem; background: #f8fafc; color: #0f172a; }
        main { max-width: 800px; margin: 0 auto; background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); }
        h1 { margin-top: 0; }
        code { background: #e2e8f0; padding: 0.15rem 0.35rem; border-radius: 0.3rem; }
    </style>
</head>
<body>
    <main>
        <h1>Latihan React useEffect + Fetch</h1>
        <p>Belajar mengambil data saat komponen pertama kali dirender.</p>

        <script type="text/babel">
            function App() {
                React.useEffect(() => {
                    fetch("https://jsonplaceholder.typicode.com/posts/1")
                        .then((response) => response.json())
                        .then((data) => console.log("Data React:", data));
                }, []);

                return <h2>Ambil data dengan useEffect</h2>;
            }

            console.log("React useEffect latihan siap");
        </script>
    </main>
</body>
</html>
