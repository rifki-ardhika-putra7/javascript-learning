<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan DOM</title>
</head>
<body>
    <main>
        <header>
            <h1 id="latihanJudul">Latihan DOM</h1>
            <button id="ubahJudulBtn">Ubah Judul</button>
        </header>
        <input id="namaInput" type="text" placeholder="Masukkan nama">
        <button id="tampilBtn">Tampilkan</button>
        <p id="hasil">Nama akan muncul di sini</p>
        <div id="box" style="width: 200px; height: 100px; background: lightgray;">
            Ini Box
        </div>
        
        <button id="merahBtn">Merah</button>
        <button id="biruBtn">Biru</button>
        <button id="hijauBtn">Hijau</button><br>

        <input id="tugasInput" type="text" placeholder="Masukkan tugas">
        <button id="tambahBtn">Tambah</button>
        
        <ul id="daftarTugas"></ul>
        <p id="status">Status: siap</p>
        
        <table border="1">
            <thead>
                <tr>
                    <th>No</th>
                    <th>Nama Tugas</th>
                    <th>Aksi</th>
                </tr>
            </thead>
        
            <tbody id="tabelTugas"></tbody>
        </table>
        
        <p id="status">Status: siap</p>
    </main>

    <script>
        const judul = document.getElementById('latihanJudul');
        const status = document.getElementById('latihanStatus');
        const ubahJudulBtn = document.getElementById('ubahJudulBtn');

        ubahJudulBtn.addEventListener('click', () => {
            judul.textContent = 'Judul Berhasil Diubah!';
            status.textContent = 'Status: judul diubah lewat DOM';
            judul.style.color = '#1d4ed8';
            judul.style.fontSize = '1.5rem';
        });

        const namaInput = document.getElementById('namaInput');
        const tampilBtn = document.getElementById('tampilBtn');
        const hasil = document.getElementById('hasil');

        tampilBtn.addEventListener('click', () => {
            const nama = namaInput.value.trim();

            if (!nama) {
                hasil.textContent = 'Nama tidak boleh kosong';
                hasil.style.color = 'red';
                return;
            }

            hasil.textContent = `Halo, ${nama}`;
            hasil.style.color = '#1d4ed8';
            hasil.style.fontWeight = 'bold';
            hasil.style.fontSize = '30px';
            hasil.style.margin = '0px';
        });

        const kotak = document.getElementById('box');
        const merah = document.getElementById('merahBtn');
        const biru = document.getElementById('biruBtn');
        const hijau = document.getElementById('hijauBtn');

        merah.addEventListener('click', () => {
            kotak.style.backgroundColor = '#FF0000';
        });

        biru.addEventListener('click', () => {
            kotak.style.backgroundColor = '#000099';
        });

        hijau.addEventListener('click', () => {
            kotak.style.backgroundColor = '#00CC00';
        });

        const tambahTugas = document.getElementById('tugasInput');
        const tombolTambah = document.getElementById('tambahTugas');
        const daftar = document.getElementById('daftarTugas');

        function tambahItemTugas() {
            const tugas = tambahTugas.value.trim();

            if (!tugas) {
                status.textContent = 'Status: isi tugas terlebih dahulu';
                return;
            }

            const item = document.createElement('li');
            item.textContent = tugas;
            item.style.cursor = 'pointer';
            item.style.marginBottom = '0.4rem';

            item.addEventListener('click', () => {
                item.remove();
                status.textContent = 'Status: item daftar dihapus';
            });

            daftar.appendChild(item);
            tambahTugas.value = '';
            status.textContent = 'Status: item berhasil ditambahkan';
        }

        tombolTambah.addEventListener('click', tambahItemTugas);

        tambahTugas.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                tambahItemTugas();
            }
        });
    </script>
</body>
</html>
