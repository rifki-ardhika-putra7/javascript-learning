<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Form Handling Lanjutan</title>
    <style>
        body { font-family: Inter, system-ui, sans-serif; margin: 0; padding: 2rem; background: #f8fafc; color: #0f172a; }
        main { max-width: 800px; margin: 0 auto; background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); }
        h1 { margin-top: 0; }
        form { display: grid; gap: 0.7rem; }
        input, button { padding: 0.7rem; }
        code { background: #e2e8f0; padding: 0.15rem 0.35rem; border-radius: 0.3rem; }
    </style>
</head>
<body>
    <main>
        <h1>Latihan Form Handling Lanjutan</h1>
        <p>Isi form di bawah lalu tekan submit.</p>

        <form id="form-login">
            <input type="text" id="nama" placeholder="Nama" />
            <input type="email" id="email" placeholder="Email" />
            <button type="submit">Kirim</button>
        </form>

        <script>
            const form = document.getElementById("form-login");
            form.addEventListener("submit", (event) => {
                event.preventDefault();

                const nama = document.getElementById("nama").value.trim();
                const email = document.getElementById("email").value.trim();

                if (nama === "") {
                    console.log("Nama wajib diisi");
                    return;
                }

                if (!email.includes("@")) {
                    console.log("Email tidak valid");
                    return;
                }

                console.log("Form valid, data dikirim:", { nama, email });
            });
        </script>
    </main>
</body>
</html>
